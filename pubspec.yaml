name: harvesthub
description: "A cross-platform eGreen Basket marketplace connecting customers directly with local farmers."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Backend, Auth & Storage (Firebase)
  flutter_dotenv: ^6.0.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  google_sign_in: ^7.2.0

  # State management
  provider: ^6.1.2

  # Networking & AI Integration
  http: ^1.2.2
  google_generative_ai: ^0.4.6
  # flutter_dotenv: ^5.2.1

  # Notifications
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  # Assets
  assets:
    - .env
    - assets/icons/
    - assets/icons/app_icon/
    - assets/images/
    - assets/images/products/
    - assets/splash_screen/
    - assets/images/bg_images/
    - assets/images/mascot/
  # - assets/images/splash_screen

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon/app_icon_master.png"
  adaptive_icon_background: "assets/icons/app_icon/icon_background.png"
  adaptive_icon_foreground: "assets/icons/app_icon/icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F9FAFB"
  image: "assets/splash_screen/logo_full_combined.png"
  android_12:
    color: "#F9FAFB"
    image: "assets/icons/app_icon/logo_mark_transparent.png"
