name: harvesthub
description: "A cross-platform eGreen Basket marketplace connecting customers directly with local farmers."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Backend, Auth & Storage (Firebase)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3

  # State management 
  provider: ^6.1.2

  # Networking & AI Integration
  http: ^1.2.2
  google_generative_ai: ^0.4.6

  # Notifications
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # see LAUNCHER_ICON_SETUP.md for the exact commands and config below.
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  # Asset declarations
  assets:
    - assets/icons/
    - assets/icons/app_icon/
    - assets/images/
    - assets/images/products/
    - assets/splash_screen/

# --- Generator config: flutter_launcher_icons ---
# Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon/app_icon_master.png"
  adaptive_icon_background: "assets/icons/app_icon/icon_background.png"
  adaptive_icon_foreground: "assets/icons/app_icon/icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true

# --- Generator config: flutter_native_splash ---
# Run: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F9FAFB"
  image: "assets/splash_screen/logo_full_combined.png"
  android_12:
    color: "#F9FAFB"
    image: "assets/icons/app_icon/logo_mark_transparent.png"
